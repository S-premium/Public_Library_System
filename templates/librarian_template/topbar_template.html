<!-- librarian_topbar_template.html -->
<!-- Slim top bar (librarian) — same design as the admin topbar.
     Hamburger on mobile, page title + quick actions on desktop.
     THEMING: all colors are CSS variables with zero-specificity defaults (:where(:root)),
     so staff_appearance.js can override them. -->

<style>
  :where(:root) {
    --accent:        #9fc1e1;
    --accent-rgb:    159,193,225;
    --accent2:       #48c78e;
    --accent2-rgb:   72,199,142;
    --danger:        #ff6363;
    --danger-rgb:    255,99,99;
    --fg:            #ffffff;
    --fg-rgb:        255,255,255;
    --topbar-bg-rgb: 25,39,54;
    --topbar-bg:     #192736;
    --sb-w:          240px;
    --sb-w-mini:     64px;
  }

  /* ── TOPBAR ── */
  .adm-topbar {
    position: fixed;
    top: 0; left: var(--sb-w); right: 0;
    height: 56px;
    background: rgba(var(--topbar-bg-rgb),.96);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(var(--accent-rgb),.09);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px 0 20px;
    z-index: 1050;
    transition: left .3s cubic-bezier(.4,0,.2,1);
  }
  @media (max-width: 992px) {
    .adm-topbar { left: 0; padding: 0 14px; }
  }

  /* ── HAMBURGER (mobile only) ── */
  .sb-toggle {
    display: none;
    align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 9px;
    background: rgba(var(--fg-rgb),.06);
    border: 1px solid rgba(var(--fg-rgb),.09);
    color: rgba(var(--fg-rgb),.8);
    font-size: 1.25rem; cursor: pointer; flex-shrink: 0; transition: .15s;
  }
  .sb-toggle:hover { background: rgba(var(--fg-rgb),.12); color: var(--fg); }
  @media (max-width: 992px) { .sb-toggle { display: flex; } }

  /* ── MOBILE BRAND ── */
  .topbar-mobile-brand {
    display: none; align-items: center; gap: 8px;
    text-decoration: none; flex: 1; margin-left: 10px;
  }
  .topbar-mobile-brand .mob-logo { width: 28px; height: 28px; border-radius: 7px; overflow: hidden; flex-shrink: 0; }
  .topbar-mobile-brand .mob-logo img { width: 100%; height: 100%; object-fit: cover; }
  .topbar-mobile-brand span { font-size: .88rem; font-weight: 700; color: var(--fg); white-space: nowrap; }
  @media (max-width: 992px) { .topbar-mobile-brand { display: flex; } }
  @media (max-width: 400px) { .topbar-mobile-brand span { display: none; } }

  /* ── RIGHT ACTIONS ── */
  .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .topbar-icon-btn {
    position: relative;
    width: 36px; height: 36px; border-radius: 9px;
    background: rgba(var(--fg-rgb),.05);
    border: 1px solid rgba(var(--fg-rgb),.08);
    color: rgba(var(--fg-rgb),.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; text-decoration: none; cursor: pointer;
    transition: .15s; flex-shrink: 0;
  }
  .topbar-icon-btn:hover { background: rgba(var(--fg-rgb),.1); color: var(--fg); }

  .topbar-icon-btn.topbar-logout {
    background: rgba(var(--danger-rgb),.1);
    border-color: rgba(var(--danger-rgb),.2);
    color: rgba(var(--danger-rgb),.8);
  }
  .topbar-icon-btn.topbar-logout:hover { background: rgba(var(--danger-rgb),.2); color: var(--danger); }

  .topbar-notif-dot {
    position: absolute; top: -3px; right: -3px;
    min-width: 16px; height: 16px; border-radius: 8px;
    background: var(--danger); border: 2px solid var(--topbar-bg);
    display: none; align-items: center; justify-content: center;
    font-size: .55rem; font-weight: 700; color: var(--fg);
    padding: 0 3px; line-height: 1;
  }
  .topbar-notif-dot.show { display: flex; }

  /* ── PAGE TITLE (desktop) ── */
  .topbar-page-title {
    font-size: .88rem; font-weight: 600;
    color: rgba(var(--fg-rgb),.55); letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar-page-title i { font-size: .8rem; margin-right: 5px; }
  @media (max-width: 992px) { .topbar-page-title { display: none; } }

  /* ── PAGE CONTENT OFFSET ── */
  .page-wrap, .content-area, main { padding-top: 56px !important; }
</style>

<!-- Load staff_appearance.js exactly once per page -->
<script>
  (function () {
    if (window.__staffAppearanceLoaded) return;
    window.__staffAppearanceLoaded = true;
    var s = document.createElement('script');
    s.src = "{{ url_for('static', filename='js/staff_appearance.js') }}";
    document.head.appendChild(s);
  })();
</script>

<!-- ══════════════════════════
     TOPBAR HTML
══════════════════════════ -->
<header class="adm-topbar" id="admTopbar">

  <!-- Hamburger — mobile only -->
  <button class="sb-toggle" id="sbToggle" onclick="openAdmSidebar()" title="Open menu">
    <i class="bi bi-list"></i>
  </button>

  <!-- Brand — mobile only -->
  <a href="/librarian/home" class="topbar-mobile-brand">
    <div class="mob-logo">
      <img src="/static/images/logo.png" alt="Logo">
    </div>
    <span>Iloilo City Library</span>
  </a>

  <!-- Page title — desktop -->
  <span class="topbar-page-title" id="topbarPageTitle"></span>

  <!-- Right-side actions -->
  <div class="topbar-actions">

    <!-- Account Requests bell -->
    <a href="/librarian/account-requests" class="topbar-icon-btn" title="Account Requests">
      <i class="bi bi-bell-fill"></i>
      <span class="topbar-notif-dot" id="navReqBadge"></span>
    </a>

    <!-- Event Calendar -->
    <a href="/librarian/event" class="topbar-icon-btn" title="Event Calendar">
      <i class="bi bi-calendar-week-fill"></i>
    </a>

    <!-- Logout -->
    <a href="/logout" class="topbar-icon-btn topbar-logout" title="Logout">
      <i class="bi bi-box-arrow-right"></i>
    </a>

  </div>

</header>

<!-- Compatibility stubs: the old librarian topbar had these ids, and some page scripts
     (e.g. librarian_dashboard) still call addEventListener on them. Without them the
     script throws and the page data never loads. Remove once those lines are deleted. -->
<div style="display:none" aria-hidden="true">
  <button id="menuToggle" type="button"></button>
  <div id="navOverlay"></div>
  <nav id="navLinksMobile"></nav>
</div>

<script>
(function () {
  /* Sidebar open/close lives in librarian_sidebar_template.html */

  /* Set page title from <title> */
  document.addEventListener('DOMContentLoaded', function () {
    const titleEl = document.getElementById('topbarPageTitle');
    if (!titleEl) return;
    const pageTitle = document.title.split('|')[0].trim();
    if (pageTitle && titleEl.textContent.trim() === '') {
      titleEl.textContent = pageTitle;
    }
  });
})();
</script>
