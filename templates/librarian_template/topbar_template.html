
<style>
  /* ── TOPBAR ── */
  .topbar {
    position:fixed; top:0; left:0; right:0; z-index:1100;
    background:rgba(30,45,61,0.95); backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(159,193,225,0.12);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 40px; height:60px;
  }
  .brand-logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; flex-shrink:0; }
  .brand-img  { width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .brand-text { font-weight:700; font-size:1.1rem; letter-spacing:-.02em; white-space:nowrap; }

  /* ── DESKTOP NAV ── */
  .nav-links     { display:flex; gap:4px; align-items:center; }
  .nav-links a {
    color:rgba(255,255,255,.65); text-decoration:none; font-weight:500;
    font-size:.88rem; padding:6px 12px; border-radius:8px; transition:.18s; white-space:nowrap;
  }
  .nav-links a:hover  { background:rgba(255,255,255,.08); color:#fff; }
  .nav-links a.active { background:rgba(159,193,225,.15); color:#9fc1e1; }
  .dropdown-menu {
    background:#253545; border:1px solid rgba(255,255,255,.1);
    border-radius:12px; padding:6px; min-width:210px;
    box-shadow:0 16px 40px rgba(0,0,0,.4);
  }
  .dropdown-menu .dropdown-item {
    color:rgba(255,255,255,.8); font-size:.88rem; font-weight:500;
    border-radius:8px; padding:8px 14px; transition:.15s;
  }
  .dropdown-menu .dropdown-item:hover { background:rgba(159,193,225,.12); color:#fff; }

  .topbar-right { display:flex; align-items:center; gap:8px; }
  .menu-toggle  { display:none; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; padding:4px; flex-shrink:0; }

  /* ── MOBILE NAV DRAWER ── */
  @media (max-width:992px) {
    .topbar      { padding:0 16px; }
    .menu-toggle { display:block; }

    .nav-links {
      position:fixed; top:60px; left:0; right:0; bottom:0;
      background:rgba(20,32,44,0.98); backdrop-filter:blur(24px);
      flex-direction:column; align-items:stretch;
      padding:12px; gap:2px; overflow-y:auto;
      transform:translateX(-100%);
      transition:transform .3s cubic-bezier(.4,0,.2,1);
      z-index:1099; border-right:1px solid rgba(159,193,225,.1);
      width:min(320px,88vw);
    }
    .nav-links.open { transform:translateX(0); }

    .nav-section-label {
      font-size:.65rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.1em; color:rgba(159,193,225,.5);
      padding:14px 12px 6px; display:block;
    }
    .nav-links a {
      padding:10px 14px; font-size:.92rem; border-radius:10px;
      display:flex; align-items:center; gap:10px; color:rgba(255,255,255,.75);
    }
    .nav-links a:hover  { background:rgba(255,255,255,.07); color:#fff; }
    .nav-links a.active { background:rgba(159,193,225,.13); color:#9fc1e1; }

    .nav-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1098; }
    .nav-overlay.show { display:block; }
  }
  @media (max-width:480px) { .brand-text { display:none; } }
  @media (max-width:360px) {
    .topbar    { padding:0 10px; height:54px; }
    .nav-links { top:54px; }
    .menu-toggle { font-size:1.4rem; }
  }
</style>


<!-- ══════════════════════════════
     TOPBAR HTML
══════════════════════════════ -->

<!-- ══════════════════════════════
     TOPBAR JS
══════════════════════════════ -->
<script>
  (function () {
    const menuToggle = document.getElementById('menuToggle');
    const navMobile  = document.getElementById('navLinksMobile');
    const navOverlay = document.getElementById('navOverlay');

    if (!menuToggle || !navMobile || !navOverlay) return;

    function openMobileNav() {
      navMobile.classList.add('open');
      navOverlay.classList.add('show');
      menuToggle.querySelector('i').className = 'bi bi-x';
    }
    function closeMobileNav() {
      navMobile.classList.remove('open');
      navOverlay.classList.remove('show');
      if (menuToggle.querySelector('i'))
        menuToggle.querySelector('i').className = 'bi bi-list';
    }
    window.closeMobileNav = closeMobileNav;

    menuToggle.addEventListener('click', () =>
      navMobile.classList.contains('open') ? closeMobileNav() : openMobileNav()
    );
    navOverlay.addEventListener('click', closeMobileNav);
  })();
</script>
