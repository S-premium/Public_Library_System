<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reset PIN | Iloilo Public Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --accent:#9fc1e1; --bg1:#1e2d3d; --bg2:#2f3f4d; --bg3:#42586b; }
    body {
      font-family:'DM Sans',sans-serif;
      background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:20px;
    }
    .card {
      background:linear-gradient(150deg,#1e2d3d,#273848);
      border:1px solid rgba(159,193,225,.2); border-radius:22px;
      padding:40px 36px; width:100%; max-width:400px;
      box-shadow:0 28px 70px rgba(0,0,0,.55);
    }
    .icon-wrap {
      width:60px; height:60px; border-radius:18px; margin:0 auto 20px;
      background:rgba(159,193,225,.12); border:1px solid rgba(159,193,225,.2);
      display:flex; align-items:center; justify-content:center;
      font-size:1.6rem;
    }
    h2 { font-size:1.15rem; font-weight:700; color:#fff;
         text-align:center; margin-bottom:8px; letter-spacing:-.02em; }
    p.sub { font-size:.83rem; color:rgba(218,232,245,.5);
            text-align:center; margin-bottom:28px; line-height:1.65; }
    label { font-size:.72rem; font-weight:700; letter-spacing:.08em;
            text-transform:uppercase; color:rgba(255,255,255,.4);
            display:block; margin-bottom:8px; }
    .pin-row { display:flex; gap:8px; justify-content:center; margin-bottom:6px; }
    .pin-digit {
      width:48px; height:56px; background:rgba(255,255,255,.07);
      border:1.5px solid rgba(159,193,225,.22); border-radius:12px;
      color:#fff; font-family:'DM Mono',monospace; font-size:1.4rem;
      font-weight:700; text-align:center; outline:none; transition:.2s;
      caret-color:var(--accent);
    }
    .pin-digit:focus {
      border-color:var(--accent); background:rgba(159,193,225,.1);
      box-shadow:0 0 0 3px rgba(159,193,225,.18); transform:translateY(-2px);
    }
    .pin-digit.filled { border-color:rgba(159,193,225,.5); background:rgba(159,193,225,.08); }
    .btn-main {
      width:100%; background:var(--accent); color:#0d1a24; border:none;
      border-radius:11px; padding:13px; font-size:.92rem; font-weight:700;
      font-family:'DM Sans',sans-serif; cursor:pointer; transition:.2s; margin-top:20px;
    }
    .btn-main:hover { background:#b8d4ec; transform:translateY(-1px); }
    .btn-main:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    .alert-box {
      background:rgba(255,99,99,.1); border:1px solid rgba(255,99,99,.28);
      border-radius:10px; padding:11px 14px; font-size:.8rem;
      color:#ff9090; margin-bottom:16px; display:none;
    }
    .alert-box.show { display:block; }
    .flash-msg {
      padding:11px 14px; border-radius:10px; font-size:.82rem;
      margin-bottom:18px; text-align:center;
    }
    .flash-success { background:rgba(72,199,142,.1); border:1px solid rgba(72,199,142,.3); color:#48c78e; }
    .flash-danger  { background:rgba(255,99,99,.1);  border:1px solid rgba(255,99,99,.28); color:#ff9090; }
    @keyframes pinShake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)}
      40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}
    }
    .shake { animation:pinShake .4s ease; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">🔑</div>
    <h2>Set New PIN</h2>
    <p class="sub">Choose a new 6-digit PIN to secure your account.<br>This replaces your expired PIN.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, message in messages %}
        <div class="flash-msg flash-{{ category }}">{{ message }}</div>
      {% endfor %}{% endif %}
    {% endwith %}

    <div class="alert-box" id="pinError"></div>

    <form method="POST" action="/reset-pin" onsubmit="return handlePinSubmit(event)">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="hidden" name="pin"   id="pinHidden">

      <label>New 6-Digit PIN</label>
      <div class="pin-row" id="pinRow">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-idx="0">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-idx="1">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-idx="2">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-idx="3">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-idx="4">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" data-idx="5">
      </div>

      <button type="submit" class="btn-main" id="submitBtn" disabled>
        🔒 Save New PIN
      </button>
    </form>
  </div>

  <script>
    const digits = Array.from(document.querySelectorAll('.pin-digit'));
    const btn    = document.getElementById('submitBtn');
    const hidden = document.getElementById('pinHidden');
    const errBox = document.getElementById('pinError');
    const row    = document.getElementById('pinRow');

    function getPin() { return digits.map(d => d.value).join(''); }

    function updateState() {
      const pin = getPin();
      hidden.value  = pin;
      btn.disabled  = pin.length < 6;
    }

    digits.forEach((d, i) => {
      d.addEventListener('input', e => {
        const val = e.target.value.replace(/\D/g, '');
        d.value = val ? val[val.length - 1] : '';
        d.classList.toggle('filled', !!d.value);
        if (d.value && i < digits.length - 1) digits[i + 1].focus();
        updateState();
      });
      d.addEventListener('keydown', e => {
        if (e.key === 'Backspace') {
          if (!d.value && i > 0) {
            digits[i-1].value = '';
            digits[i-1].classList.remove('filled');
            digits[i-1].focus();
          } else {
            d.value = '';
            d.classList.remove('filled');
          }
          updateState();
        }
        if (e.key === 'ArrowLeft'  && i > 0)               digits[i-1].focus();
        if (e.key === 'ArrowRight' && i < digits.length-1)  digits[i+1].focus();
      });
      d.addEventListener('paste', e => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData)
                        .getData('text').replace(/\D/g,'');
        pasted.split('').forEach((ch, j) => {
          if (digits[i+j]) { digits[i+j].value = ch; digits[i+j].classList.add('filled'); }
        });
        digits[Math.min(i + pasted.length, digits.length-1)].focus();
        updateState();
      });
    });

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.add('show');
      row.classList.remove('shake');
      void row.offsetWidth;
      row.classList.add('shake');
      digits.forEach(d => { d.value = ''; d.classList.remove('filled'); });
      digits[0].focus();
      updateState();
    }

    function handlePinSubmit(e) {
      const pin = getPin();
      if (pin.length < 6) { e.preventDefault(); showError('Please enter all 6 digits.'); return false; }
      if (!/^\d{6}$/.test(pin)) { e.preventDefault(); showError('PIN must contain only numbers.'); return false; }
      return true;
    }

    // Auto-focus first digit
    digits[0].focus();
  </script>
</body>
</html>
