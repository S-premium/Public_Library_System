<!-- topbar_template.html -->
<!-- Slim top bar — shows on mobile only (hamburger to open sidebar), and provides page-level actions on desktop -->

<style>
  /* ── TOPBAR ── */
  .adm-topbar {
    position: fixed;
    top: 0; left: var(--sb-w); right: 0;
    height: 56px;
    background: rgba(25,39,54,0.96);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(159,193,225,0.09);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px 0 20px;
    z-index: 1050;
    transition: left .3s cubic-bezier(.4,0,.2,1);
  }

  /* On mobile the topbar spans full width (sidebar is off-canvas) */
  @media (max-width: 992px) {
    .adm-topbar {
      left: 0;
      padding: 0 14px;
    }
  }

  /* ── HAMBURGER (mobile only) ── */
  .sb-toggle {
    display: none;
    align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border-radius: 9px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.09);
    color: rgba(255,255,255,.8);
    font-size: 1.25rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: .15s;
  }
  .sb-toggle:hover { background: rgba(255,255,255,.12); color: #fff; }

  @media (max-width: 992px) {
    .sb-toggle { display: flex; }
  }

  /* ── MOBILE BRAND (hidden on desktop because sidebar shows it) ── */
  .topbar-mobile-brand {
    display: none;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    flex: 1;
    margin-left: 10px;
  }
  .topbar-mobile-brand .mob-logo {
    width: 28px; height: 28px; border-radius: 7px;
    overflow: hidden; flex-shrink: 0;
  }
  .topbar-mobile-brand .mob-logo img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .topbar-mobile-brand span {
    font-size: .88rem; font-weight: 700; color: #fff;
    white-space: nowrap;
  }
  @media (max-width: 992px) {
    .topbar-mobile-brand { display: flex; }
  }
  @media (max-width: 400px) {
    .topbar-mobile-brand span { display: none; }
  }

  /* ── RIGHT ACTIONS ── */
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .topbar-icon-btn {
    position: relative;
    width: 36px; height: 36px;
    border-radius: 9px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    text-decoration: none;
    cursor: pointer;
    transition: .15s;
    flex-shrink: 0;
  }
  .topbar-icon-btn:hover { background: rgba(255,255,255,.1); color: #fff; }

  .topbar-notif-dot {
    position: absolute;
    top: -3px; right: -3px;
    min-width: 16px; height: 16px;
    border-radius: 8px;
    background: var(--danger);
    border: 2px solid #192736;
    display: none;
    align-items: center; justify-content: center;
    font-size: .55rem; font-weight: 700; color: #fff;
    padding: 0 3px;
    line-height: 1;
  }
  .topbar-notif-dot.show { display: flex; }

  /* ── PAGE TITLE (desktop) ── */
  .topbar-page-title {
    font-size: .88rem;
    font-weight: 600;
    color: rgba(255,255,255,.55);
    letter-spacing: -.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-page-title i { font-size: .8rem; margin-right: 5px; }
  @media (max-width: 992px) {
    .topbar-page-title { display: none; }
  }

  /* ── PAGE CONTENT OFFSET ── */
  /* All pages that use this topbar need top padding */
  .page-wrap, .content-area, main {
    padding-top: 56px !important;
  }

  /* Sidebar already handles left padding via body padding-left */
</style>

<!-- ══════════════════════════
     TOPBAR HTML
══════════════════════════ -->
<header class="adm-topbar" id="admTopbar">

  <!-- Hamburger — mobile only -->
  <button class="sb-toggle" id="sbToggle" onclick="openAdmSidebar()" title="Open menu">
    <i class="bi bi-list"></i>
  </button>

  <!-- Brand — mobile only -->
  <a href="/admin/home" class="topbar-mobile-brand">
    <div class="mob-logo">
      <img src="/static/images/logo.png" alt="Logo">
    </div>
    <span>Iloilo City Library</span>
  </a>

  <!-- Page title — desktop -->
  <span class="topbar-page-title" id="topbarPageTitle">
    <!-- Filled dynamically by pages, or leave blank -->
  </span>

  <!-- Right-side actions -->
  <div class="topbar-actions">

    <!-- Account Requests bell -->
    <a href="/admin/account-requests" class="topbar-icon-btn" title="Account Requests">
      <i class="bi bi-bell-fill"></i>
      <span class="topbar-notif-dot" id="navReqBadge"></span>
    </a>

    <!-- Event Calendar -->
    <a href="/admin/event" class="topbar-icon-btn" title="Event Calendar">
      <i class="bi bi-calendar-week-fill"></i>
    </a>

    <!-- Logout -->
    <a href="/logout" class="topbar-icon-btn"
       title="Logout"
       style="background:rgba(255,99,99,.1);border-color:rgba(255,99,99,.2);color:rgba(255,130,130,.8);"
       onmouseover="this.style.background='rgba(255,99,99,.2)';this.style.color='#ff6363';"
       onmouseout="this.style.background='rgba(255,99,99,.1)';this.style.color='rgba(255,130,130,.8)';">
      <i class="bi bi-box-arrow-right"></i>
    </a>

  </div>

</header>

<script>
(function () {
  /* Expose close sidebar to topbar (in case user taps outside on mobile) */
  /* Main open/close lives in sidebar_template.html */

  /* Set page title from meta or h1 */
  document.addEventListener('DOMContentLoaded', function () {
    const titleEl = document.getElementById('topbarPageTitle');
    if (!titleEl) return;
    /* Try <title> tag first */
    const pageTitle = document.title.split('|')[0].trim();
    if (pageTitle && titleEl.textContent.trim() === '') {
      titleEl.textContent = pageTitle;
    }
  });
})();
</script>
