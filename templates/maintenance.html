<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/images/logo.png">
  <title>Under Maintenance | Iloilo Public Library</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --accent:  #9fc1e1;
      --bg1:     #1e2d3d;
      --bg2:     #2f3f4d;
      --bg3:     #42586b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      padding: 52px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      animation: fadeUp .5s cubic-bezier(.16,.84,.44,1);
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:none; }
    }

    .icon-wrap {
      width: 80px; height: 80px;
      border-radius: 22px;
      background: rgba(255,152,0,.13);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; color: #ffb74d;
      margin: 0 auto 28px;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,152,0,.25); }
      50%      { box-shadow: 0 0 0 16px rgba(255,152,0,0); }
    }

    .badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(255,152,0,.1); border: 1px solid rgba(255,152,0,.25);
      border-radius: 20px; padding: 4px 14px;
      font-size: .7rem; font-weight: 700; color: #ffb74d;
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #ffb74d;
      animation: blink 1.8s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -.03em;
      margin-bottom: 14px;
    }

    .message {
      font-size: .9rem;
      color: rgba(218,232,245,.65);
      line-height: 1.75;
      margin-bottom: 32px;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,.08);
      margin-bottom: 28px;
    }

    .brand {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-decoration: none; color: rgba(255,255,255,.5);
    }
    .brand img {
      width: 28px; height: 28px; border-radius: 7px;
      object-fit: contain;
      background: rgba(159,193,225,.1); padding: 3px;
    }
    .brand-text { font-size: .82rem; font-weight: 600; }

    /* Lockdown variant */
    body.lockdown .icon-wrap {
      background: rgba(255,80,80,.13);
      color: #ff7070;
    }
    body.lockdown .badge {
      background: rgba(255,80,80,.1);
      border-color: rgba(255,80,80,.25);
      color: #ff9090;
    }
    body.lockdown .badge-dot { background: #ff7070; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body class="{{ 'lockdown' if mode == 'lockdown' else '' }}">
  <div class="card">
    <div class="icon-wrap">
      {% if mode == 'lockdown' %}
        <i class="bi bi-shield-lock-fill"></i>
      {% else %}
        <i class="bi bi-cone-striped"></i>
      {% endif %}
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      {% if mode == 'lockdown' %}Security Lockdown{% else %}Maintenance Mode{% endif %}
    </div>

    <h1>
      {% if mode == 'lockdown' %}
        System Temporarily Locked
      {% else %}
        We'll Be Right Back
      {% endif %}
    </h1>

    <p class="message">{{ message }}</p>

    <hr class="divider">

    <a href="/" class="brand">
      <img src="/static/images/logo.png" alt="Logo" onerror="this.style.display='none'">
      <span class="brand-text">Iloilo Public Library</span>
    </a>
  </div>
</body>
</html>
